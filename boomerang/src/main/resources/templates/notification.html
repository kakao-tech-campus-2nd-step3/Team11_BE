<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .notification {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        #status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .connected { background: #d4edda; }
        .disconnected { background: #f8d7da; }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    <!-- 먼저 SockJS를 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <!-- 그 다음 STOMP를 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h1>WebSocket Test</h1>
<div id="status"></div>
<button onclick="sendTestMessage()">Send Test Message</button>
<div id="messages"></div>

<script>
    let stompClient = null;
    const token = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxNSIsImVtYWlsIjoidGVzdEBtYWlsIiwiaWF0IjoxNzMxMzMxNDQwLCJleHAiOjI0MTczMTMzMTQ0MH0.KydGnwy3HeaQEXYxbqxmxjFXQES00vdaLpvnj02EMg8";

    function connect() {
        const socket = new SockJS(`http://localhost:8080/api/v1/ws/notifications?token=${token}`);
        stompClient = Stomp.over(socket);

        // STOMP 클라이언트 설정
        stompClient.heartbeat.outgoing = 10000; // 클라이언트 -> 서버 heartbeat
        stompClient.heartbeat.incoming = 10000; // 서버 -> 클라이언트 heartbeat

        stompClient.connect({},
            function(frame) {
                updateStatus(true);
                showMessage('Connection established and subscriptions created successfully.');
                console.log('Connected:', frame);

                // 개인 알림 구독
                stompClient.subscribe('/user/queue/notifications', function(message) {
                    console.log('Received notification: ', message.body);
                    const notification = JSON.parse(message.body);
                    showMessage('Private Notification: ' + notification.message);
                });

                // 전체 알림 구독
                stompClient.subscribe('/topic/notifications', function(message) {
                    console.log('Received broadcast: ', message.body);
                    showMessage('Broadcast Notification: ' + message.body);
                });
            },
            function(error) {
                updateStatus(false);
                showMessage('Connection error: ' + error);
                console.error('STOMP error:', error);
                setTimeout(connect, 5000);
            }
        );
    }

    function updateStatus(connected) {
        const status = document.getElementById('status');
        status.textContent = connected ? 'Connected' : 'Disconnected - Trying to reconnect...';
        status.className = connected ? 'connected' : 'disconnected';
    }

    function showMessage(message) {
        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');
        messageElement.className = 'notification';
        messageElement.textContent = message;
        messagesDiv.insertBefore(messageElement, messagesDiv.firstChild);
    }

    function sendTestMessage() {
        fetch('http://localhost:8080/api/v1/message', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `${token}`
            },
            body: JSON.stringify("Test message at " + new Date().toLocaleTimeString())
        })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                showMessage('Test message sent successfully.');
            })
            .catch(error => {
                showMessage('Error sending message: ' + error.message);
                console.error('Error:', error);
            });
    }

    // 페이지 로드시 연결
    window.addEventListener('load', connect);

    // 페이지 언로드시 연결 해제
    window.addEventListener('beforeunload', function() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
    });
</script>
</body>
</html>
