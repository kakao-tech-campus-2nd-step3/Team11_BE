<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chat Room</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
</head>
<body>
<div th:replace="layout :: header"></div>
<div class="container mt-4">
  <h1>Chat Room</h1>
  <div class="mb-3">
    <input type="text" id="authToken" class="form-control" placeholder="Enter your token">
    <button class="btn btn-secondary mt-2" onclick="initializeChat()">Enter Chat Room</button>
  </div>
  <div id="messageArea" class="border p-3" style="height: 400px; overflow-y: scroll;">
    <!-- Messages will appear here -->
  </div>
  <div class="input-group mt-3">
    <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
  </div>
</div>

<script th:inline="javascript">
  let socket;
  let isSocketInitialized = false; // WebSocket 초기화 여부 확인
  const roomId = /*[[${roomId}]]*/ 1;

  function initializeChat() {
    const token = $('#authToken').val();
    if (token) {
      if (!isSocketInitialized) { // 이미 WebSocket이 연결된 상태인지 확인
        loadChatMessages(token);
        connectWebSocket(token);
        isSocketInitialized = true; // WebSocket이 초기화되었음을 표시
      } else {
        console.log("WebSocket is already initialized.");
      }
    } else {
      alert("Please enter your token.");
    }
  }

  function loadChatMessages(token) {
    const page = 0;
    const size = 1000;

    $.ajax({
      url: `/api/v1/chat/${roomId}/messages?page=${page}&size=${size}`,
      type: "GET",
      beforeSend: function(xhr) {
        xhr.setRequestHeader("Authorization", token);
      },
      success: function (data) {
        $('#messageArea').empty();
        data.content.forEach(function (message) {
          $('#messageArea').append(
                  `<div><strong>${message.nickname}</strong> [${new Date(message.createdAt).toLocaleString()}]: ${message.message}</div>`
          );
        });
        $('#messageArea').scrollTop($('#messageArea')[0].scrollHeight);
      },
      error: function() {
        alert("Failed to load messages. Please check the token or server status.");
      }
    });
  }

  function connectWebSocket(token) {
    socket = new WebSocket(`ws://localhost:8080/ws/chat/${roomId}?token=${token}`);

    socket.onmessage = function (event) {
      const message = JSON.parse(event.data);
      $('#messageArea').append(
              `<div><strong>${message.senderNickname}</strong> [${new Date(message.createdAt).toLocaleString()}]: ${message.message}</div>`
      );
      $('#messageArea').scrollTop($('#messageArea')[0].scrollHeight);
    };

    socket.onclose = function () {
      alert("Disconnected from chat room.");
      isSocketInitialized = false; // 연결이 끊어지면 다시 초기화 가능하도록 설정
    };
  }

  function sendMessage() {
    const messageContent = $('#messageInput').val();
    if (messageContent) {
      const message = { message: messageContent };
      socket.send(JSON.stringify(message));
      $('#messageInput').val('');
    } else {
      alert("Please enter a message.");
    }
  }

  // Enter 키로 메시지 전송 기능 추가
  $(document).ready(function() {
    $('#messageInput').on('keydown', function(event) {
      if (event.key === 'Enter') {
        sendMessage();
        event.preventDefault(); // 기본 Enter 키 동작 방지
      }
    });
  });
</script>
</body>
</html>
