name: Deploy

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Connect and deploy to server
        env:
          PEM_FILE: ${{ secrets.SSH_KEY }}
        run: |
          echo "$PEM_FILE" > kwy-root.pem
          chmod 600 kwy-root.pem

          ssh -o StrictHostKeyChecking=no -i "kwy-root.pem" ubuntu@ec2-52-79-80-3.ap-northeast-2.compute.amazonaws.com << 'EOF'

            # JAVA_HOME 및 PATH 설정
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            export PATH=$JAVA_HOME/bin:$PATH

            # 프로젝트 클론 또는 업데이트
            if [ ! -d "Team11_BE" ]; then
              git clone https://github.com/kakao-tech-campus-2nd-step3/Team11_BE.git
            fi
            cd Team11_BE/boomerang

            # 반영 사항 업데이트
            git pull origin deploy

            # 기존 실행 중인 프로세스 종료
            ps -ef | grep java | grep boomerang-0.0.1-SNAPSHOT.jar | awk '{print $2}' | xargs -r kill -9

            # .env 파일을 application.properties로 변환
            mkdir -p src/main/resources
            envsubst < ~/boomerang.env > src/main/resources/application.properties

            # 빌드 재실행
            chmod +x ./gradlew
            ./gradlew build -x test

            # 애플리케이션 배포
            nohup java -jar build/libs/boomerang-0.0.1-SNAPSHOT.jar > log.txt 2>&1 &

            # 로그 파일 확인
            sleep 5
            ls -l log.txt || echo "log.txt 파일이 없습니다."
            cat log.txt || echo "log.txt가 비어 있습니다."

          EOF
