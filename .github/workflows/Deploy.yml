name: Deploy

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # 최신 버전 사용

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.5.4  # 최신 버전 사용
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}  # GitHub Secrets에 저장된 SSH 키 사용

      - name: Connect and deploy to server
        env:
          PEM_FILE: ${{ secrets.SSH_KEY }}
        run: |
          echo "$PEM_FILE" > kwy-root.pem  # PEM 파일 생성
          chmod 600 kwy-root.pem  # 권한 설정

          ssh -o StrictHostKeyChecking=no -i "kwy-root.pem" ubuntu@ec2-43-203-254-19.ap-northeast-2.compute.amazonaws.com << 'EOF'
            # 프로젝트 클론 또는 업데이트
            if [ ! -d "Team11_BE" ]; then
              git clone https://github.com/kakao-tech-campus-2nd-step3/Team11_BE.git
            fi
            cd Team11_BE

            # 반영 사항 업데이트
            git pull origin deploy

            # boomerang 디렉터리로 이동하여 빌드 실행
            cd boomerang

            # 기존 실행 중인 프로세스 종료
            ps -ef | grep java | grep boomerang-0.0.1-SNAPSHOT.jar | awk '{print $2}' | xargs -r kill -9

            # .env 파일을 참조해 application.properties 작성
            source ~/boomerang.env
            mkdir -p src/main/resources
            envsubst < ~/boomerang.env > src/main/resources/application.properties

            # 빌드 재실행 (권한 없으면 chmod 적용)
            chmod +x ./gradlew
            ./gradlew build -x test

            # 애플리케이션 배포
            nohup java -jar build/libs/boomerang-0.0.1-SNAPSHOT.jar > log.txt 2>&1 &

            # 로그 파일 확인
            tail -f log.txt
          EOF
